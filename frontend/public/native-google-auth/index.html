<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0D0D12" />
    <title>BarathX — Continue with Google</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d0d12;
        --fg: #f4f4f5;
        --muted: #a1a1aa;
        --accent: #ff671f;
        --err: #f87171;
        --card: #18181f;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "DM Sans", system-ui, sans-serif;
        background: radial-gradient(1200px 600px at 50% -10%, #2a1810 0%, var(--bg) 55%);
        color: var(--fg);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      main {
        width: 100%;
        max-width: 420px;
        background: var(--card);
        border: 1px solid #2a2a35;
        border-radius: 16px;
        padding: 1.75rem 1.5rem 1.5rem;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.65rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .mark {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: var(--accent);
        color: #111;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 0.85rem;
      }
      h1 {
        margin: 1.1rem 0 0.4rem;
        font-size: 1.45rem;
        line-height: 1.2;
      }
      .hint { color: var(--muted); font-size: 0.95rem; line-height: 1.45; margin: 0.35rem 0; }
      .error { color: var(--err); font-size: 0.95rem; line-height: 1.4; margin-top: 0.85rem; }
      #google-host { margin-top: 1.25rem; min-height: 48px; }
      #google-host.is-busy { opacity: 0.4; pointer-events: none; }
      .links { margin-top: 1.4rem; font-size: 0.85rem; }
      .links a { color: var(--muted); }
      .open-app {
        display: inline-block;
        background: var(--accent);
        color: #111;
        font-weight: 700;
        text-decoration: none;
        padding: 0.85rem 1.1rem;
        border-radius: 999px;
        margin-top: 0.75rem;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <main>
      <div class="brand"><span class="mark">BX</span><span>BarathX</span></div>
      <h1>Signing you in</h1>
      <p class="hint" id="lead">
        Choose your Google account once — then you’ll return to BarathX.
      </p>
      <div id="age-warn" class="error" hidden>
        Go back to the app, tick <strong>18+</strong> and <strong>Privacy</strong>, then try again.
      </div>
      <div id="google-host"></div>
      <p id="status" class="hint">Connecting to Google…</p>
      <p id="error" class="error" hidden></p>
      <p class="links">
        <a href="https://barathx.com/privacy">Privacy</a> ·
        <a href="https://barathx.com/terms">Terms</a>
      </p>
    </main>
    <script>
      (function () {
        var API = "https://baratx-production.up.railway.app";
        var CLIENT_ID = "682923055091-imk39450dk207psnoetvhnvseslvq0qp.apps.googleusercontent.com";
        var DEEP = "barathx://google-auth";
        var params = new URLSearchParams(location.search);
        var ageOk = params.get("age") === "1";
        var privacyOk = params.get("privacy") === "1";
        var statusEl = document.getElementById("status");
        var errorEl = document.getElementById("error");
        var host = document.getElementById("google-host");
        var exchanged = false;

        if (!ageOk || !privacyOk) {
          document.getElementById("age-warn").hidden = false;
          statusEl.textContent = "";
        }

        function showError(msg) {
          errorEl.hidden = false;
          errorEl.textContent = msg;
          statusEl.textContent = "";
          host.classList.remove("is-busy");
        }

        function openApp(token) {
          var q = "token=" + encodeURIComponent(token);
          var deep = DEEP + "?" + q;
          var intent =
            "intent://google-auth?" +
            q +
            "#Intent;scheme=barathx;package=com.baratx.app;end";
          location.href = /Android/i.test(navigator.userAgent || "") ? intent : deep;
          return deep;
        }

        function finish(token) {
          statusEl.textContent = "Signed in — returning to the app…";
          host.classList.add("is-busy");
          var deep = openApp(token);
          setTimeout(function () {
            statusEl.innerHTML =
              'Signed in. If the app didn’t open, tap below:<br/>' +
              '<a class="open-app" href="' + deep + '">Open BarathX app</a>';
            errorEl.hidden = true;
          }, 900);
        }

        function exchange(idToken) {
          if (exchanged) return;
          exchanged = true;
          statusEl.textContent = "Signing you in…";
          host.classList.add("is-busy");
          fetch(API + "/auth/google", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-BarathX-Client": "web",
            },
            body: JSON.stringify({
              id_token: idToken,
              confirm_age_18: ageOk,
              accept_privacy: privacyOk,
            }),
          })
            .then(function (res) {
              return res.json().then(function (data) {
                if (!res.ok) throw new Error(data.detail || data.message || "Google sign-in failed");
                if (!data.access_token) throw new Error("No access token returned");
                finish(data.access_token);
              });
            })
            .catch(function (err) {
              exchanged = false;
              showError(String((err && err.message) || err));
            });
        }

        function startGoogle() {
          if (!window.google || !window.google.accounts || !window.google.accounts.id) return false;
          if (!ageOk || !privacyOk) {
            statusEl.textContent = "";
            return true;
          }

          window.google.accounts.id.initialize({
            client_id: CLIENT_ID,
            callback: function (res) {
              if (res && res.credential) exchange(res.credential);
            },
            // Prefer silent/auto when Chrome already has the account (Custom Tabs).
            auto_select: true,
            cancel_on_tap_outside: false,
            context: "signin",
            ux_mode: "popup",
          });

          host.innerHTML = "";
          window.google.accounts.id.renderButton(host, {
            theme: "outline",
            size: "large",
            shape: "pill",
            text: "continue_with",
            width: Math.min(320, host.offsetWidth || 280),
          });

          statusEl.textContent = "Choose your account…";
          try {
            window.google.accounts.id.prompt(function (notification) {
              if (!notification) return;
              if (notification.isDisplayed && notification.isDisplayed()) {
                statusEl.textContent = "Choose your Google account…";
                return;
              }
              if (
                notification.isNotDisplayed() ||
                notification.isSkippedMoment() ||
                notification.isDismissedMoment()
              ) {
                statusEl.textContent = "Tap Continue with Google once.";
              }
            });
          } catch (e) {
            statusEl.textContent = "Tap Continue with Google once.";
          }
          return true;
        }

        function boot() {
          if (startGoogle()) return;
          var n = 0;
          var t = setInterval(function () {
            n += 1;
            if (startGoogle() || n > 40) clearInterval(t);
            if (n > 40 && !host.childNodes.length) {
              showError("Could not load Google. Check your connection and retry.");
            }
          }, 200);
        }

        if (document.readyState === "complete") boot();
        else window.addEventListener("load", boot);
      })();
    </script>
  </body>
</html>
