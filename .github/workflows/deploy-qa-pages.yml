name: Deploy QA Cloudflare Pages

# Optional. Prefer Railway same-origin QA (see brand/qa/PROVISION.md).
# Required secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Optional var: CLOUDFLARE_QA_PAGES_PROJECT (default baratx-qa)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-qa-pages.yml"

jobs:
  deploy-qa:
    runs-on: ubuntu-latest
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE: https://baratx-qa.up.railway.app
          VITE_GOOGLE_CLIENT_ID: 682923055091-imk39450dk207psnoetvhnvseslvq0qp.apps.googleusercontent.com
      - name: Publish QA to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_QA_PAGES_PROJECT || 'baratx-qa' }}
          workingDirectory: frontend
