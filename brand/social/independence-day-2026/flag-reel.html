<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Happy 80th Independence Day — BarathX</title>
    <meta
      name="description"
      content="Happy 80th Independence Day from BarathX — India’s public square. Leave one honest take."
    />
    <style>
      :root {
        --bg: #080a0e;
        --saffron: #ff9933;
        --text: #fff8eb;
        --muted: rgba(255, 248, 235, 0.72);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background:
          radial-gradient(ellipse 80% 50% at 50% 0%, rgba(255, 153, 51, 0.22), transparent 55%),
          radial-gradient(ellipse 70% 40% at 50% 100%, rgba(19, 136, 8, 0.18), transparent 50%),
          var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 1.25rem 1rem 2.5rem;
      }
      h1 {
        margin: 0.5rem 0 0.25rem;
        font-size: clamp(1.35rem, 4vw, 1.85rem);
        letter-spacing: -0.02em;
        text-align: center;
      }
      .sub {
        margin: 0 0 1.25rem;
        color: var(--muted);
        text-align: center;
        font-size: 1rem;
      }
      .player {
        width: min(100%, 420px);
        border-radius: 1rem;
        overflow: hidden;
        border: 1px solid rgba(255, 153, 51, 0.35);
        background: #000;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
      }
      video {
        display: block;
        width: 100%;
        height: auto;
        vertical-align: middle;
      }
      .cta {
        margin-top: 1.35rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        padding: 0.95rem 1.6rem;
        border-radius: 999px;
        background: var(--saffron);
        color: #fff;
        font-weight: 800;
        font-size: 1.15rem;
        text-decoration: underline;
        text-underline-offset: 4px;
        box-shadow: 0 8px 24px rgba(255, 153, 51, 0.35);
      }
      .cta:hover,
      .cta:focus-visible {
        filter: brightness(1.06);
        outline: 2px solid #fff;
        outline-offset: 3px;
      }
      .hint {
        margin: 0.85rem 0 0;
        font-size: 0.9rem;
        color: var(--muted);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>Happy 80th Independence Day</h1>
    <p class="sub">BarathX — India’s public square.</p>
    <div class="player">
      <video
        controls
        playsinline
        preload="metadata"
        poster="barathx-independence-day-flag-poster.jpg"
        src="barathx-independence-day-flag-reel.mp4"
      >
        Your browser does not support video.
      </video>
    </div>
    <!-- Real clickable link (MP4 on-screen text cannot be tapped) -->
    <a class="cta" href="https://barathx.com" rel="noopener noreferrer">
      https://barathx.com
    </a>
    <p class="hint">Leave one honest take · Browser soft launch · Apps coming soon</p>
  </body>
</html>
